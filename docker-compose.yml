version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: industrial-slm-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models/industrial_slm_model_v2
      - DATA_PATH=/app/data/processed
      - KB_PATH=/app/knowledge_base/documents
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
      - ./backend/knowledge_base:/app/knowledge_base
    restart: unless-stopped
    networks:
      - slm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: industrial-slm-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - slm-network

networks:
  slm-network:
    driver: bridge
