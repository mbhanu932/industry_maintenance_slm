[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-maintenance-copilot"
version = "2.0.0"
description = "Production-ready AI-powered industrial maintenance diagnostic system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Industrial SLM Team", email = "team@industrial-slm.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "numpy>=1.26.0,<1.27.0",
    "pandas>=2.2.0,<2.3.0",
    "pyarrow>=17.0.0,<18.0.0",
    "scikit-learn>=1.5.0,<1.6.0",
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<3.0.0",
    "transformers>=4.46.0,<4.47.0",
    "torch>=2.4.0,<2.5.0",
    "structlog>=24.4.0,<25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.10.0",
    "flake8>=7.1.0",
    "mypy>=1.11.0",
]
security = [
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
]
monitoring = [
    "prometheus-client>=0.21.0",
    "psutil>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/industrial-slm/maintenance-copilot"
Documentation = "https://docs.industrial-slm.com"
Repository = "https://github.com/industrial-slm/maintenance-copilot.git"
Issues = "https://github.com/industrial-slm/maintenance-copilot/issues"

[project.scripts]
industrial-copilot = "src.api.main:main"
copilot-validate = "scripts.validate_environment:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests across multiple components",
    "safety: Safety-critical tests for production validation",
    "slow: Tests that take more than 1 second to run",
    "auth: Authentication and authorization tests",
    "audit: Audit trail and compliance tests",
    "neural: Neural model and AI component tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2
fail_under = 85

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "node_modules"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection for tests